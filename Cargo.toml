[package]
name = "balance-engine"
version = "0.1.0"
edition = "2021"
description = "Live balances and discovery of every coin, token and NFT a wallet holds, over several public RPCs per chain (addresses only, no keys, no API keys)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same features as registry, history-engine and price-engine: no extra build cost.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Chain, coin and token metadata: which chains exist, their RPCs, their lists.
registry = { version = "0.1.0", path = "../registry" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
